# Crossplane resources to provision a VPC, subnet, security group, and two EC2 instances
# via provider-aws-ec2 / provider-aws-vpc (upbound family).
# Apply from your rke2 cluster with: kubectl apply -f ec2-instances-crossplane.yaml
#
# Prerequisites (must already exist in the cluster):
#   - provider-family-aws + provider-aws-ec2 installed
#   - a ProviderConfig named "default" with valid AWS credentials
#
# NOTE: Replace `ami` below with a real AMI ID for your region (us-east-1).
# Amazon Linux 2023 AMI IDs change over time; look up the current one with:
#   aws ssm get-parameters --names /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 --region us-east-1
#
# Cross-resource references (vpcIdSelector, subnetIdSelector, etc.) use label matching,
# so Crossplane wires the VPC ID / Subnet ID / Security Group ID together automatically
# once each dependency is Ready — no need to hardcode IDs.

apiVersion: ec2.aws.upbound.io/v1beta1
kind: VPC
metadata:
  name: demo-vpc
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    cidrBlock: 10.0.0.0/16
    enableDnsSupport: true
    enableDnsHostnames: true
    tags:
      Name: demo-vpc
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: InternetGateway
metadata:
  name: demo-igw
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    vpcIdSelector:
      matchLabels:
        app: demo
    tags:
      Name: demo-igw
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: Subnet
metadata:
  name: demo-subnet
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    cidrBlock: 10.0.1.0/24
    mapPublicIpOnLaunch: true
    availabilityZone: us-east-1a
    vpcIdSelector:
      matchLabels:
        app: demo
    tags:
      Name: demo-subnet
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: RouteTable
metadata:
  name: demo-rtb
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    vpcIdSelector:
      matchLabels:
        app: demo
    tags:
      Name: demo-rtb
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: Route
metadata:
  name: demo-route-default
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    destinationCidrBlock: 0.0.0.0/0
    routeTableIdSelector:
      matchLabels:
        app: demo
    gatewayIdSelector:
      matchLabels:
        app: demo
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: RouteTableAssociation
metadata:
  name: demo-rtb-assoc
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    subnetIdSelector:
      matchLabels:
        app: demo
    routeTableIdSelector:
      matchLabels:
        app: demo
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: SecurityGroup
metadata:
  name: demo-sg
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    name: demo-sg
    description: Allow SSH and outbound traffic for demo instances
    vpcIdSelector:
      matchLabels:
        app: demo
    tags:
      Name: demo-sg
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: SecurityGroupRule
metadata:
  name: demo-sg-rule-ssh-ingress
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    type: ingress
    fromPort: 22
    toPort: 22
    protocol: tcp
    cidrBlocks:
      - 23.124.147.21/32 # your current public IP (detected via ifconfig.me) — update if it changes
    securityGroupIdSelector:
      matchLabels:
        app: demo
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: SecurityGroupRule
metadata:
  name: demo-sg-rule-egress
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    type: egress
    fromPort: 0
    toPort: 0
    protocol: "-1"
    cidrBlocks:
      - 0.0.0.0/0
    securityGroupIdSelector:
      matchLabels:
        app: demo
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: KeyPair
metadata:
  name: demo-keypair
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    publicKey: "ssh-rsa  ermin@Ermins-Air.attlocal.net"
    tags:
      Name: demo-keypair
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: Instance
metadata:
  name: instance-1
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    instanceType: t3.micro
    ami: ami-07a5b367e8dc8bd92
    keyName: demo-keypair
    subnetIdSelector:
      matchLabels:
        app: demo
    vpcSecurityGroupIdSelector:
      matchLabels:
        app: demo
    tags:
      Name: instance-1
  providerConfigRef:
    name: default
---
apiVersion: ec2.aws.upbound.io/v1beta1
kind: Instance
metadata:
  name: instance-2
  labels:
    app: demo
spec:
  forProvider:
    region: us-east-1
    instanceType: t3.micro
    ami: ami-07a5b367e8dc8bd92
    keyName: demo-keypair
    subnetIdSelector:
      matchLabels:
        app: demo
    vpcSecurityGroupIdSelector:
      matchLabels:
        app: demo
    tags:
      Name: instance-2
  providerConfigRef:
    name: default
