# Crossplane resources to provision a VPC network, subnetwork, firewall rules, and two
# Compute Engine instances via provider-gcp-compute (upbound family).
# Apply from your rke2 cluster with: kubectl apply -f gce-instances-crossplane.yaml
#
# Prerequisites (must already exist in the cluster):
#   - provider-family-gcp + provider-gcp-compute installed
#   - a ProviderConfig named "default-gcp" with valid GCP credentials and projectID set
#
# NOTE: Replace `sourceImage` below if you want a different OS.
# Look up current Debian 12 image family info with:
#   gcloud compute images list --project debian-cloud --filter="family=debian-12"
#
# Cross-resource references (networkSelector, subnetworkSelector, etc.) use label matching,
# so Crossplane wires the Network self-link / Subnetwork self-link together automatically
# once each dependency is Ready — no need to hardcode URLs.

apiVersion: compute.gcp.upbound.io/v1beta1
kind: Network
metadata:
  name: demo-gcp-vpc
  labels:
    app: demo-gcp
spec:
  forProvider:
    autoCreateSubnetworks: false
    routingMode: REGIONAL
  providerConfigRef:
    name: default-gcp
---
apiVersion: compute.gcp.upbound.io/v1beta1
kind: Subnetwork
metadata:
  name: demo-gcp-subnet
  labels:
    app: demo-gcp
spec:
  forProvider:
    region: us-central1
    ipCidrRange: 10.10.1.0/24
    privateIpGoogleAccess: true
    networkSelector:
      matchLabels:
        app: demo-gcp
  providerConfigRef:
    name: default-gcp
---
apiVersion: compute.gcp.upbound.io/v1beta1
kind: Firewall
metadata:
  name: demo-gcp-fw-ssh-ingress
  labels:
    app: demo-gcp
spec:
  forProvider:
    networkSelector:
      matchLabels:
        app: demo-gcp
    direction: INGRESS
    sourceRanges:
      - 23.124.147.21/32 # your current public IP (detected via ifconfig.me) — update if it changes
    targetTags:
      - demo-gcp
    allow:
      - protocol: tcp
        ports:
          - "22"
  providerConfigRef:
    name: default-gcp
---
apiVersion: compute.gcp.upbound.io/v1beta1
kind: Firewall
metadata:
  name: demo-gcp-fw-egress
  labels:
    app: demo-gcp
spec:
  forProvider:
    networkSelector:
      matchLabels:
        app: demo-gcp
    direction: EGRESS
    destinationRanges:
      - 0.0.0.0/0
    targetTags:
      - demo-gcp
    allow:
      - protocol: all
  providerConfigRef:
    name: default-gcp
---
# Free tier: GCP's always-free Compute Engine allowance is exactly 1 non-preemptible
# e2-micro instance/month, only in us-central1/us-west1/us-east1 (we're already in
# us-central1), plus 30GB-months standard PD and 1GB egress to US destinations.
# e2-small does not qualify — only e2-micro does — and it's 1 instance, not 2.
apiVersion: compute.gcp.upbound.io/v1beta1
kind: Instance
metadata:
  name: gce-instance-1
  labels:
    app: demo-gcp
spec:
  forProvider:
    zone: us-central1-a
    machineType: e2-micro
    tags:
      - demo-gcp
    bootDisk:
      - initializeParams:
          - image: debian-cloud/debian-12
          - diskSizeGb: 30
    networkInterface:
      - subnetworkSelector:
          matchLabels:
            app: demo-gcp
        accessConfig:
          - {} # ephemeral external IP
    metadata:
      ssh-keys: "ermin:ssh-rsa  ermin@Ermins-Air.attlocal.net"
  providerConfigRef:
    name: default-gcp
